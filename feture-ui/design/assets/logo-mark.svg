<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="stepGrad" gradientUnits="userSpaceOnUse" x1="72" y1="376" x2="456" y2="208">
      <stop offset="0" stop-color="#2F6BFF"/>
      <stop offset="0.5" stop-color="#00B8D9"/>
      <stop offset="1" stop-color="#00E0FF"/>
    </linearGradient>
    <linearGradient id="lineGrad" gradientUnits="userSpaceOnUse" x1="88" y1="360" x2="432" y2="120">
      <stop offset="0" stop-color="#2F6BFF"/>
      <stop offset="1" stop-color="#00E0FF"/>
    </linearGradient>
  </defs>

  <g transform="translate(-8,-8)">
    <!-- 三段上升阶梯（越阶） -->
    <rect x="72" y="320" width="128" height="56" rx="10" fill="url(#stepGrad)"/>
    <rect x="200" y="264" width="128" height="56" rx="10" fill="url(#stepGrad)"/>
    <rect x="328" y="208" width="128" height="56" rx="10" fill="url(#stepGrad)"/>

    <!-- 上扬折线（股价/上涨） -->
    <path d="M88 360 L184 300 L280 232 L432 120"
          fill="none" stroke="url(#lineGrad)" stroke-width="22"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- AI 数据节点（发光圆点） -->
    <circle cx="88" cy="360" r="27" fill="#00E0FF" opacity="0.18"/>
    <circle cx="184" cy="300" r="27" fill="#00E0FF" opacity="0.18"/>
    <circle cx="280" cy="232" r="27" fill="#00E0FF" opacity="0.18"/>
    <circle cx="432" cy="120" r="27" fill="#00E0FF" opacity="0.18"/>
    <circle cx="88" cy="360" r="14" fill="#FFFFFF"/>
    <circle cx="184" cy="300" r="14" fill="#FFFFFF"/>
    <circle cx="280" cy="232" r="14" fill="#FFFFFF"/>
    <circle cx="432" cy="120" r="14" fill="#FFFFFF"/>
  </g>
</svg>
